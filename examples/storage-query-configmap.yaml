apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-query-script
  namespace: default
data:
  query_storage.py: |
    #!/usr/bin/env python3
    """
    Azure Storage Query Script using Workload Identity
    
    This script demonstrates how to use Azure Workload Identity to authenticate
    and query Azure Storage containers and blobs from within an AKS cluster.
    
    For detailed network flow analysis, see: docs/network-workflow.md
    """
    
    import os
    from azure.identity import DefaultAzureCredential
    from azure.storage.blob import BlobServiceClient
    
    def main():
        print("=== Azure Storage Query using Workload Identity ===")
        
        # Get storage account name from environment or use default
        storage_account_name = os.environ.get('STORAGE_ACCOUNT_NAME', 'akswliddevcentralusst')
        account_url = f"https://{storage_account_name}.blob.core.windows.net"
        
        print(f"Storage Account: {storage_account_name}")
        print(f"Account URL: {account_url}")
        
        try:
            # Use DefaultAzureCredential which will use workload identity when running in AKS
            credential = DefaultAzureCredential()
            
            # Create BlobServiceClient
            blob_service_client = BlobServiceClient(account_url=account_url, credential=credential)
            
            print("\n=== Listing Containers ===")
            containers = blob_service_client.list_containers()
            container_names = []
            
            for container in containers:
                print(f"Container: {container.name}")
                container_names.append(container.name)
            
            if not container_names:
                print("No containers found.")
                return
            
            # Query each container for blobs
            for container_name in container_names:
                print(f"\n=== Blobs in Container: {container_name} ===")
                
                container_client = blob_service_client.get_container_client(container_name)
                blobs = container_client.list_blobs()
                
                blob_count = 0
                for blob in blobs:
                    blob_count += 1
                    print(f"  Blob: {blob.name}")
                    print(f"    Size: {blob.size} bytes")
                    print(f"    Last Modified: {blob.last_modified}")
                    if hasattr(blob, 'content_settings') and blob.content_settings:
                        print(f"    Content Type: {blob.content_settings.content_type}")
                    else:
                        print(f"    Content Type: (not set)")
                    
                    # Download and display content for small text files
                    if blob.size and blob.size < 1000:  # Only for small files
                        try:
                            blob_client = container_client.get_blob_client(blob.name)
                            blob_content = blob_client.download_blob().readall().decode('utf-8')
                            print(f"    Content: {blob_content}")
                        except Exception as e:
                            print(f"    Content: Unable to read as text - {e}")
                    print()
                
                if blob_count == 0:
                    print(f"  No blobs found in container '{container_name}'")
            
            print("✅ Storage query completed successfully!")
            
        except Exception as e:
            print(f"❌ Error querying storage: {e}")
            return 1
        
        return 0
    
    if __name__ == "__main__":
        exit(main())
