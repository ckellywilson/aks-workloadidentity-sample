apiVersion: v1
kind: Pod
metadata:
  name: token-inspector
  namespace: default
  labels:
    azure.workload.identity/use: "true"
spec:
  serviceAccountName: workload-identity-sa
  containers:
  - name: inspector
    image: python:3.9-slim
    command: ["/bin/bash"]
    args: 
    - "-c"
    - |
      echo "=== Inspecting Azure Workload Identity Token ==="
      echo
      echo "1. Environment Variables:"
      echo "AZURE_FEDERATED_TOKEN_FILE: ${AZURE_FEDERATED_TOKEN_FILE}"
      echo "AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}"
      echo "AZURE_TENANT_ID: ${AZURE_TENANT_ID}"
      echo
      
      echo "2. Token file location and permissions:"
      ls -la "${AZURE_FEDERATED_TOKEN_FILE}"
      echo
      
      echo "3. Token file contents (JWT token):"
      cat "${AZURE_FEDERATED_TOKEN_FILE}"
      echo
      echo
      
      echo "4. Decoding JWT token header and payload:"
      pip install PyJWT > /dev/null 2>&1
      python3 << 'PYTHONEOF'
      import jwt
      import json
      import os
      
      token_file = os.environ.get('AZURE_FEDERATED_TOKEN_FILE')
      if token_file:
          try:
              with open(token_file, 'r') as f:
                  token = f.read().strip()
              
              # Decode without verification to inspect contents
              header = jwt.get_unverified_header(token)
              payload = jwt.decode(token, options={"verify_signature": False})
              
              print("JWT Header:")
              print(json.dumps(header, indent=2))
              print("\nJWT Payload:")
              print(json.dumps(payload, indent=2))
              
          except Exception as e:
              print(f"Error decoding token: {e}")
      PYTHONEOF
      
      echo
      echo "5. Volume mount details:"
      df -h "${AZURE_FEDERATED_TOKEN_FILE%/*}"
      echo
      mount | grep azure
      echo
      
      echo "=== Token inspection complete ==="
      sleep 30
  restartPolicy: Never
